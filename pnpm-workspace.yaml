
packages:

  # Our rule: if it has a package.json, it's a workspace.
  # The planning documents at the root and the raw material in notes/ have none,
  # so they are just folders and files, built by nothing and installed by nothing.

  # The Tauri desktop application for Mac, Windows, and Linux. Everything that was at the
  # repository root until September 2026 lives here now
  - desktop

  # fujidesktop.app — the website and its documentation, built by VitePress to static
  # files that our own reverse proxy serves
  - site

  # Fuji's linux packages — the deb, the rpm and the flatpak — built on a mac through docker rather than on a linux box. Its one dependency is ergo, for how its output says a size, and everything else it does is orchestrate containers whose toolchains live inside them
  - linux

  # Steel, fuji's safe Rust: the scout, its reader of a file's first bytes, and the walker of a folder tree, a crate
  # fuji's Rust depends on by path. Its package.json has no dependencies and names two cargo commands, test and fuzz,
  # so it answers to pnpm the way every other folder does
  - steel

  # Copper, fuji's Rust that needs neither Tauri nor a window and cannot be safe Rust: every call into C and the
  # operating system's own libraries away from a window, a crate fuji's Rust depends on by path, tested with nothing of Tauri compiled
  - copper

# esbuild's install script only swaps its node launcher for the native binary, which arrives anyway as @esbuild/<platform>, so every install here has skipped it and the site, whose vite brings esbuild, builds without it; naming it keeps pnpm from asking on a fresh install
ignoredBuiltDependencies:
  - esbuild
