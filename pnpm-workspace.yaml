
packages:

  # Our rule: if it has a package.json, it's a workspace.
  # The planning documents at the root and the raw material in notes/ have none,
  # so they are just folders and files, built by nothing and installed by nothing.

  # The Tauri desktop application for Mac, Windows, and Linux. Everything that was at the
  # repository root until September 2026 lives here now
  - desktop

  # fujidesktop.app — the website and its documentation, built by VitePress to static
  # files that our own reverse proxy serves
  - site

  # Fuji's linux packages — the deb, the rpm and the flatpak — built on a mac
  # through docker rather than on a linux box. It has no dependencies of its own, because
  # everything it does is orchestrate containers and the toolchains live inside those
  - linux

  # The mac release that goes through Apple, signed with a Developer ID and notarized, and
  # the console that watches it. Everything that depends on Apple's program lives here, so
  # the self-signed release in desktop never needs it
  - apple
