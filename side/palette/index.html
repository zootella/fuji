<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette</title>
</head>
<body>
<!--
the palette, which pnpm palette in side serves and opens in the browser: fuji's colors and the candidates for them, a tab for each, drawn with fuji's own stylesheet, faces, drawings and bar, which side's Vite configuration reaches into desktop for
-->
<div id="app"></div>
<script type="module">
import {createApp} from 'vue'
import '../../desktop/src/style.css'//fuji's one stylesheet, as main.js loads it: the reset, the root's menu font, the bundled faces, the named classes and the palette
import './palette.js'//and every color in it again, on the root as the stylesheet declares it, which palette.js says why
import {platform} from '../../desktop/src/plastic/library.js'
import Palette from './Palette.vue'

document.documentElement.dataset.platform = platform()//the platform on the root, as the shell puts it there, so a selection and a menu here take the look they do in fuji on this machine
createApp(Palette).mount('#app')
</script>
</body>
</html>
