# Steel, fuji's safe Rust: the scout, its reader of a file's first bytes, and the walker of a folder tree, as a crate of its own whose root forbids unsafe code, so it builds, tests and fuzzes here with nothing of fuji around it; fuji's Rust depends on it by path. Never published

[package]
name = "steel"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] } # the answer derives Serialize, for the command in fuji that hands it to the page
zootella-ergo = "0.2" # spans of time and sizes in bytes, the same constants fuji's rust and its page use, from the ergo project; its own rust holds no unsafe but does not forbid it, and the hashing crates beneath it use unsafe inside, so the wall this crate's root raises covers its own lines and not ergo's, which no file's bytes reach from here
