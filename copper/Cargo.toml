# Copper, fuji's Rust that needs neither Tauri nor a window and cannot be safe Rust: every call into C and into the operating system's own libraries away from a window, as a crate of its own so it builds and tests with nothing of Tauri around it, and so it can be built into a binary of its own. Fuji's Rust depends on it by path. Never published

[package]
name = "copper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] } # the probe's answer and the library's versions derive Serialize, for the commands in brass that hand them to the page, and the inventory's options and counts cross the same way
serde_json = "1" # the inventory's lines
steel = { path = "../steel" } # the scout and the walker, which the inventory reads every file with; copper calls steel and never the other way
zootella-ergo = "0.2.0" # the hashes the inventory writes, and the kept times' form, from the ergo project

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0" # the display's size in panel.rs, and the bitmap context thumbnail.rs draws into
core-foundation = "0.10" # already beneath core-graphics; named so thumbnail.rs can build ImageIO's option dictionary
foreign-types-shared = "0.3" # the raw pointers behind core-graphics's types, which panel.rs and thumbnail.rs hand to calls declared by hand
objc2 = "0.6" # the objective-c runtime beneath the three below
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] } # NSWorkspace for launch.rs, and the feature that lets it take a UTType
objc2-foundation = "0.3"
objc2-uniform-type-identifiers = "0.3" # UTType, the kind of file launch.rs asks NSWorkspace about
block2 = "0.6" # the block launch.rs hands NSWorkspace to be called when a default application is set
libc = "0.2" # memory.rs asks mach and libproc through it, host_statistics64 and proc_pid_rusage, and sysctlbyname

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2" # setlocale, which media.rs calls before the first player on linux

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] } # Storage_FileSystem is for inventory.rs, which asks for a file's change time and count of names by handle; Threading for uptime.rs's process times and memory.rs's process handles; WindowsAndMessaging for panel.rs's screen metrics; Registry, Security and Shell for registry.rs, Security because RegCreateKeyExW takes a security attributes pointer; ProcessStatus and SystemInformation for memory.rs; and the imaging, Com, StructuredStorage and Variant features for thumbnail.rs
