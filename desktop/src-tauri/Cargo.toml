[package]
name = "fuji" # brandStem, the name files carry: cargo names the executable from it, the page and the build scripts read it here, and rust has it as crate_name in its package info; the README's section The two names says where else the names are set
version = "0.1.0"
description = "A multimedia file manager designed with privacy and precision in mind"
# becomes the deb's Maintainer and the rpm's packager, both of which are public in every installed copy — so a project address rather than a person's
authors = ["Fuji <team@fujidesktop.app>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name unique and wouldn't conflict with the bin name. This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
# brandStem and that suffix, written out because a manifest cannot read its own package's name; main.rs calls the library by it, so the two change together
name = "fuji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2" # for its Rust half alone, the system's open and save boxes dialog.rs puts up off the Mac, where AppKit's are called directly; the page is granted none of it
open = { version = "5", features = ["shellexecute-on-windows"] } # opens a file or an address with the program the system has for it, for process.rs: ShellExecuteEx on windows, which the feature turns on in place of a powershell process, /usr/bin/open on a mac, and xdg-open on linux; the crate Tauri's opener plugin wraps, and fuji's own dependency now that the plugin is gone
serde = { version = "1", features = ["derive"] }
serde_json = "1"
display-info = "0.5"
scout = { path = "../../scout" } # fuji's own reader of a file's first bytes and walker of a folder tree, a crate of its own in the scout folder at the repository root, where it is tested and fuzzed alone; scout.rs is its command
zootella-ergo = "0.2.0" # small helpers that give the same answers in rust as on the page, from the ergo project, and the hashes; its sha1 and sha2 are a generation newer than the sha2 in tauri's tree, so the lockfile holds both until tauri moves

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_SystemServices"] } # the imaging features are for thumbnail.rs; Registry, Security and Shell are for registry.rs, Security because RegCreateKeyExW takes a security attributes pointer; Dwm and HiDpi are for window.rs, to find where a window's visible frame is; SystemInformation, ProcessStatus and Threading are for memory.rs, the last two to open another process and read its memory counters; Gdi and LibraryLoader are for the video window in window.rs, the black brush its class paints with and the module handle it is registered under, and Ole and SystemServices are its drop target, the interface and the key flags its methods take; KeyboardAndMouse is the drag fuji runs itself in window.rs, which takes the mouse, and Shell is that drag's subclass as well
webview2-com = "0.38" # the web view's key event, which window.rs handles to turn off the browser's shortcut keys; tauri already brings this crate at this version, and the controller tauri hands over is its type
windows-core = "0.62" # the version fuji's own windows crate is built on, named here because the implement macro that makes the video window's drop target in window.rs expands to this crate's bare name, and the bare name has to be the 0.62 whose interfaces the target implements
webview2-core = { package = "windows-core", version = "0.61" } # the trait window.rs and memory.rs cast webview2-com's types with, from the version that crate is built on; the 0.62 above does not reach them, and tauri already brings this one, so it goes by a name of its own to leave the bare name to the version above

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10" # already beneath core-graphics; named so thumbnail.rs can build ImageIO's option dictionary
foreign-types-shared = "0.3"
objc2 = "0.6" # menu.rs turns AppKit's menu validation back on for the View submenu; all three are already in the tree beneath tao
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] } # and the feature that lets NSWorkspace take a UTType, for launch.rs
objc2-foundation = "0.3"
objc2-uniform-type-identifiers = "0.3" # UTType, the kind of file launch.rs asks NSWorkspace about; new to the tree, from the same family and release as the three above
block2 = "0.6" # touch.rs hands AppKit the block its scroll monitor calls; already in the tree beneath objc2-app-kit
objc2-quartz-core = "0.3" # CAOpenGLLayer and CATransaction, the layer window.rs gives the video view on the mac and the commit after each frame; already in the tree beneath objc2-app-kit
libc = "0.2" # memory.rs asks mach and libproc through it, host_statistics64 and proc_pid_rusage, and sysctlbyname; already in the tree beneath tauri

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18" # the GL area a video draws in and the overlay that holds it over the web view, for window.rs; the version tauri's runtime is built on, already in the tree
gdk = "0.18" # the display, which says whether its GL is EGL's or GLX's, and the GL context; beneath gtk
glib = "0.18" # a widget from its address, and a signal's answer; beneath both
libc = "0.2" # dlopen for the GL loader in window.rs, and setlocale in media.rs; already in the tree
